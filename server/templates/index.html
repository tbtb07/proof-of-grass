<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Proof of Grass</title>
  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      padding: 2rem 1rem;
    }
    button {
      font-size: 1.2rem;
      padding: 0.9rem 1.8rem;
      border-radius: 0.5rem;
      border: none;
      background: #2e7d32;
      color: white;
    }
    #result {
      margin-top: 1.5rem;
      font-size: 1.1rem;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <h1>Proof of Grass</h1>
  <p>Take a photo to check if you're outside.</p>

  <input type="file" id="photo-input" accept="image/*" capture="environment" hidden>
  <button id="photo-button">Take Photo</button>

  <div id="result"></div>

  <script>
    const input = document.getElementById("photo-input");
    const button = document.getElementById("photo-button");
    const result = document.getElementById("result");

    button.addEventListener("click", () => input.click());

    input.addEventListener("change", async () => {
      const file = input.files[0];
      if (!file) return;

      result.textContent = "Checking...";

      const formData = new FormData();
      formData.append("photo", file);

      try {
        const response = await fetch("/check", { method: "POST", body: formData });
        const data = await response.json();
        if (!response.ok) {
          result.textContent = `Error: ${data.error || "unknown error"}`;
        } else if (data.outdoor) {
          result.textContent = `✅ Outdoor\n${data.reason}`;
        } else {
          result.textContent = `❌ Not outdoor\n${data.reason}`;
        }
      } catch (err) {
        result.textContent = `Error: ${err.message}`;
      }

      input.value = "";
    });
  </script>
</body>
</html>
